name: ᝯㄝₓ Custom Fields Bulk Editor
description: "View and bulk edit custom fields across a whole selection, or across the whole library. Select anything in an entity list (Scenes, Images, Galleries, Performers, Studios, Groups or Tags), open the \"...\" menu and pick \"Custom Fields...\" - or run the task in Settings - Tasks - Plugin Tasks to cover every entity of all seven types at once.\n\nThe dialog lists every custom field the entities in scope carry - one line per entity and field - with filters on the entity type, the field name, the entity itself and the value - each text filter matching either \"contains\" or \"omits\", and the value filter also offering \"is empty\", \"is true\" and \"is not true\". An [INFO] line names every custom field found, with a count. Click an entity to open it in a new tab, or a field name or value to copy it; copying a selection of lines gives plain text.\n\nOne field is written at a time, in one of four ways: Add sets it only where it is missing, Overwrite sets that one field everywhere, replacing the value already there and leaving the entity's other custom fields alone, Remove deletes it, and Rename moves the field itself to a new name, keeping every value - offered while everything in scope carries the same one field name. The write covers either everything in scope or only the lines the filters leave showing.\n\nNothing is written until you press Apply. Afterwards the list shows exactly what changed and Undo puts the previous values back, field by field, and stays offered while the dialog is open. Rescan re-reads without closing, and Copy log takes the counters, the messages and the whole listing as plain text.\n\nEvery custom field can also carry a description of its own, shown as a tooltip on the field name. The second task, \"Manage Custom Field Descriptions...\", scans the library, lists every field with what carries it, and keeps the descriptions in the description of one tag - so they live in the database, are covered by the database backup, and are the same in every browser.\n\nAn entity carrying the custom field named in the settings below is hidden from Stash's add/select dropdowns - the list you pick a tag, performer, studio, group, gallery or scene from while editing something else. It stays on its own list page, on the entities that already have it, and in the API.\n\nScene markers are not offered: they are the one selectable entity in Stash with no custom fields at all.\n\nRequires Stash 0.31.0 or newer."
url: "https://github.com/gregttx/StashPlugins/blob/main/CustomFieldsBulkEditor/README.md"
version: 2.7.0
ui:
  javascript:
    - CustomFieldsBulkEditor.js
settings:
  a1SkipImagesInTask:
    displayName: Skip Images in the Whole-Library Task
    description: "Leave Images out of the library-wide task, so it covers the other six types only.\n\nImages are usually the most numerous type in a library by a wide margin, and reading them can be most of the wait. Off by default, so the task covers all seven types as it always has. It has no effect on a selection: the \"...\" menu acts on exactly what you selected, and an image list is one of the places you can open it from.\n\nIt applies to the descriptions task as well, where a field only images carry will then read as an orphan."
    type: BOOLEAN
  b1DescriptionTagName:
    displayName: Description Store Tag Name
    description: "The name of the tag that holds every custom field's description.\n\nThe descriptions live in that tag's own description field, as one block of JSON under a sentence saying what it is. The tag is created the first time you press Apply in \"Manage Custom Field Descriptions...\", and is marked with the custom field ᱜ╦╦🞮_🛂🧲_🛠🛈🖫_desc_store so that it can always be found again - so renaming it here renames the existing tag rather than starting a second store. It is left out of the bulk editor's own listings, since what it carries is this plugin's plumbing rather than your data.\n\nThe default name is written into this box the first time the plugin loads, so what you see here is what it is using. Leave it empty to go back to that default. A name another tag already has cannot be taken: the write fails and says so."
    type: STRING
  c1ExcludeFromAddListField:
    displayName: Hide from Add Lists - Custom Field Name
    description: "Entities carrying this custom field are hidden from Stash's add/select dropdowns.\n\nIt covers Tags, Performers, Studios, Groups, Galleries and Scenes - the six things Stash lets you pick from a dropdown while editing something else. A marked entity is still on its own list page, still on the entities that already have it, and still in the API: this hides it from being added, nothing more. Any value other than empty, 0 or false counts as marked; the plugin writes 1 when it marks its own store tag.\n\nThe list is read once per page load, so marking something in another tab shows up here after a reload. The default name is written into this box the first time the plugin loads; clearing it switches the filtering off entirely, which is why an empty box and an unset one are not the same thing. Renaming the field with the bulk editor's Rename mode moves this setting with it, so the two never drift apart."
    type: STRING
tasks:
  - name: Edit Custom Fields Across the Whole Library...
    description: Open the same dialog on every Scene, Image, Gallery, Performer, Studio, Group and Tag in the library, rather than on a selection. It lists what they carry, and one Apply writes one custom field across all of them - or across only the lines the filters leave showing. Nothing is written until you press Apply, and Undo takes it back while the dialog stays open. Reading a large library takes a moment; the dialog counts up as it goes.
  - name: Manage Custom Field Descriptions...
    description: Write down what each custom field means. It scans the library, lists every custom field found on the left with how many entities carry it, and gives each one a description box and a read-only list of what carries it. Descriptions are kept in the description of one tag, so they are in the database rather than in your browser. Nothing is written until you press Apply, and Undo puts the tag back while the dialog stays open.
