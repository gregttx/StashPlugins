name: ᝯㄝₓ Find Entities by Text Content
description: "Which entities in your library mention this text? Stash cannot be asked - it will filter a scene list on a scene's own details and a performer list on a performer's own details, and nothing at all on whichever custom fields an entity happens to carry. This plugin is that one question, with one box to type it into.\n\nRun it from Settings - Tasks - Plugin Tasks. Type what to look for, turn on the entity types you want searched - they all start off, so nothing is read until you say so - and press Search. It looks in every text field of every Scene, Image, Gallery, Performer, Studio, Group and Tag you turned on: titles, details, descriptions, synopses, aliases, URLs, directors, photographers, and the names and values of custom fields.\n\nResults arrive as they are found, one line per entity: the entity with its id, which attributes matched and how many times each, and the text around the first match with the match marked. Click one to open it in a new tab. Counters and a cursor across the top say how far it has read, out of how many, and that it is still going.\n\nA second row of filters fills in as the search finds attributes to offer - Title, Details, Aliases, custom field names and values, and the rest - one for every attribute something has actually matched in. Turning one off hides the entities that only matched there and drops that attribute from the lines that also matched elsewhere, so a line never claims a match it is hiding. The two rows act at different moments: entity types decide what is read, attributes decide what is shown.\n\nSearch becomes Pause while it runs and Resume after, so a long search can be stopped and picked up rather than started again. When the list on screen is full it pauses itself and the button reads Continue, which clears the screen and carries on - Copy log keeps every result either way, including the ones the screen no longer shows. Refresh throws the results away and searches again.\n\nThe dialog can remember the entity types you chose, and can keep the last few things you searched for and offer them back in the box itself as you type. Both live in this browser rather than on the server, both are off until you ask for them, and setting the number of remembered searches to zero is also how that list is cleared.\n\nNothing is written to your library at any point: this is a read and a list of links. There is no undo because there is nothing to undo.\n\nMatching is a plain case-insensitive substring, so a short word matches inside longer ones - the text around every result is there so you can see which it was. Which fields your Stash actually has is settled by asking it rather than assumed, so a field this plugin looks for and your server does not have is skipped instead of failing the whole search.\n\nScene markers are not searched: a marker carries a title and no page of its own to open.\n\nRequires Stash 0.31.0 or newer."
url: "https://github.com/gregttx/StashPlugins/blob/main/FindEntitiesByTextContent/README.md"
version: 1.1.1
ui:
  javascript:
    - FindEntitiesByTextContent.js
tasks:
  - name: Find Entities by Text Content...
    description: Search every text field of every Scene, Image, Gallery, Performer, Studio, Group and Tag for a piece of text - titles, details, descriptions, synopses, aliases, URLs, and the names and values of custom fields. Turn on the types you want, type what to look for, and results arrive as they are found, each one a link. Search pauses and resumes, and pauses itself when the list on screen is full. Nothing is written to your library.
