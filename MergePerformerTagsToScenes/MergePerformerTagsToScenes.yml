name: Merge Performer Tags To Scenes
description: "README: https://github.com/gregttx/StashPlugins/blob/d6442c70d43b2181b39592f4c183eb7f74b020e3/MergePerformerTagsToScenes/README.md - Merges performer tags into their scenes. Supports manual buttons (off by default) on performer and scene pages, auto-merge on save (off by default), and exclusion filters for organized scenes, tagged scenes, ignored tags, and tags marked via a custom field. The scene button stages tags in the edit form for review by default. A library-wide task in Settings - Tasks - Plugin Tasks merges every performer's tags into all of their scenes in one run, showing every planned change for review first; nothing is written until you press Proceed, and an Undo button takes the merge back while the dialog stays open. Merges can optionally be logged in the JS console (useful to monitor Auto Merge). Auto-merge stands down while another plugin (such as Normalize Parent Tags) is applying bulk changes. The library-wide task also reports whether Normalize Parent Tags' own auto modes are active, and what they would do to the merge. BACK UP YOUR DATABASE BEFORE THE FIRST RUN - these tasks rewrite tag assignments across the whole library and Stash has no undo. Requires Stash 0.31.0 or newer."
url: "https://github.com/gregttx/StashPlugins/blob/d6442c70d43b2181b39592f4c183eb7f74b020e3/MergePerformerTagsToScenes/README.md"
version: 1.10.0
ui:
  javascript:
    - MergePerformerTagsToScenes.js
tasks:
  - name: Merge Performer Tags into All Their Scenes
    description: Copy every performer's tags onto every scene they appear in, across the whole library. Opens a dialog that lists every change first; nothing is written until you press Proceed. The merge only ever adds tags, and an Undo button takes back what it added - but only while the dialog stays open, so back up your database before the first run. The exclusion filters below all apply.
settings:
  a1ShowManualMergeButtons:
    displayName: Show Manual Merge Buttons
    description: Show "Add Tags to Scene(s)" on the performer detail view (not while editing) and "Add Perf Tags" on the scene Edit tab. Buttons only appear when related content exists (the performer button also needs the performer to have at least one tag).
    type: BOOLEAN
  a2SaveTagsImmediately:
    displayName: Save Tags Immediately
    description: Make "Add Perf Tags" merge and save in one step. Leave this off to stage the tags in the scene's tag box for review instead, so you can check them and press Save yourself. Only affects the scene button; the performer button and auto-merge always save.
    type: BOOLEAN
  a3AutoMergeOnSceneUpdate:
    displayName: Auto Merge On Scene Updates
    description: When a scene is saved, automatically merge all of its performers' tags into that scene.
    type: BOOLEAN
  a4AutoMergeOnPerformerUpdate:
    displayName: Auto Merge On Performer Updates
    description: When a performer is saved, automatically merge their tags into all of their scenes. Covers every scene featuring the performer; filters and selections in the scene list are ignored.
    type: BOOLEAN
  b1ExcludeSceneWithTagName:
    displayName: Exclude Scenes with specified Tag Name
    description: Do not merge performer tags to scenes if the scene has this tag name
    type: STRING
  b2ExcludeSceneOrganized:
    displayName: Exclude Scenes marked as Organized
    description: Do not merge performer tags to scenes if the scene is marked as Organized
    type: BOOLEAN
  c1ExcludeTagWithIgnoreAutoTag:
    displayName: Exclude Tags set to Ignore auto tag
    description: Do not merge a performer tag to scenes if the tag is set to Ignore auto tag
    type: BOOLEAN
  c2ExcludeTagWithCustomFieldName:
    displayName: Exclude Tags marked via a Custom Field
    description: Do not merge a performer tag to scenes if the tag has this custom field. Only the presence of the field matters - its value is ignored, so any value at all excludes the tag. Remove the field from a tag to have it merged again.
    type: STRING
  d1LogMergesToConsole:
    displayName: Log Tag merges to the Browser Console (Info level)
    description: Logs each performer tag merge to the browser's JavaScript console (F12 - Console), not to the Stash server log or the Logs page
    type: BOOLEAN
