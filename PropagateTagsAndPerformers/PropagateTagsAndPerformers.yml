name: ᝯㄝₓ Propagate Tags and Performers to Related Entities
description: "Copies tags and performers from related entities onto the entity that links them.\n\nThirteen paths, each off until you enable it in the Path Settings dialog. Tags onto Scenes from their performers, studio, markers or groups; onto Galleries from their images; onto Images from their galleries; onto Groups from their scenes, studio, sub-groups, and from those scenes' performers and markers. Performers onto Scenes from their galleries, and onto Galleries from their images.\n\nCopy, never move - nothing is ever removed from the source.\n\nThree ways to run it: buttons on the target's Edit tab or the source's own detail page, automatically whenever Stash saves an entity, or as one library-wide task in Settings - Tasks - Plugin Tasks. The buttons and the automatic modes are off until you enable them below.\n\nNothing is written behind your back: a button either stages its additions in the edit form for you to save, or opens a dialog listing every change first - and so does the task. Nothing lands until you press Proceed, and Undo takes the run back while the dialog stays open.\n\nBACK UP YOUR DATABASE BEFORE THE FIRST RUN - it rewrites tag and performer assignments across the whole library and Stash has no undo.\n\nRequires Stash 0.31.0 or newer."
url: "https://github.com/gregttx/StashPlugins/blob/main/PropagateTagsAndPerformers/README.md"
version: 3.6.2
ui:
  javascript:
    - PropagateTagsAndPerformers.js
tasks:
  - name: Propagate Tags and Performers to All Related Entities...
    description: Run every path enabled below across the whole library, in a fixed order. Opens a dialog that lists every change first; nothing is written until you press Proceed. It only ever adds tags and performers, and an Undo button takes back what it added - but only while the dialog stays open, so back up your database before the first run. The exclusion filters below all apply.
  - name: Path Settings...
    description: Choose which of the thirteen paths run - Off, On, and for the two that offer it, only the tags every source shares. One button per path, taking its next state on each click, plus All Off / All On / All On with common tags only, opposite Save in the footer. Hovering a path name says what that path copies onto what. A path that is off while other enabled paths already carry its tags end to end reads On in amber letters on the resting background, and names the paths doing it. The dialog holds all thirteen, grouped by what they carry, and writes nothing but the setting itself, which is the one shown in the row below.
settings:
  a1ShowManualButtons:
    displayName: Show Manual Buttons
    description: "Show a button on the Edit tab of scenes, galleries, images and groups for each enabled path into that entity, and a matching button on the detail page of the source itself - a performer, a studio, or one of the four entities acting as a source for another - pushing its tags or performers out to everything an enabled path reaches. Marker paths have no source button: a marker has no detail page of its own to put one on.\n\nOne button per path, so enabling two of the five scene paths shows two buttons rather than five. A button is hidden when its source does not exist at all - no performers, no studio, nothing to walk - but stays visible and reports \"No changes\" when a source exists and there is simply nothing new to copy. The source-side buttons have no staging option - one click can reach many different entities at once, and there is no single form to stage that into - so they open a review dialog listing every change instead, and write nothing until you press Proceed."
    type: BOOLEAN
  a2SaveImmediately:
    displayName: Save Immediately
    description: "Make the manual buttons review in a dialog instead of staging in the form.\n\nLeave this off to stage the tags or performers in the edit form, so you can check them and press Save yourself. Turned on - or on a Stash that cannot stage - a click opens a dialog listing every change first, and nothing is written until you press Proceed. Only affects the buttons; the automatic modes always save."
    type: BOOLEAN
  a3AutoOnTargetUpdate:
    displayName: Auto Propagate when the Target is Saved
    description: "Whenever Stash saves a scene, gallery, image or group, immediately run every enabled path that copies into it.\n\nUpdates immediately, with no dialog and no undo, but only ever adds. Reads one entity per save, so it is the cheaper of the two automatic modes. The exclusion filters below still apply."
    type: BOOLEAN
  a4AutoOnSourceUpdate:
    displayName: Auto Propagate when the Source is Saved
    description: "Whenever Stash saves an entity, immediately push its tags or performers into every entity an enabled path copies them to.\n\nUpdates immediately, with no dialog and no undo, but only ever adds. This one fans out - saving a performer can rewrite every scene they appear in - so it is far more expensive than the mode above. The exclusion filters below still apply."
    type: BOOLEAN
  b1Paths:
    displayName: Paths
    description: "Which of the thirteen paths run, and how, as one line.\n\nA path is Off, On, or - for the two that offer it - on for only the tags every source shares. Off is what a path does until you say otherwise; a path that is on is covered by the task, shows its manual buttons, and is written along by whichever automatic modes are enabled above.\n\nPress Path Settings to change it: the thirteen buttons are the editor for this setting, and each one takes its next state on a click. Three buttons above them set every path at once. It is stored as one line of text, and anything that writes it directly is read forgivingly - any order, any case, and any separators between the pairs - with whatever was understood written back in canonical form. A path nobody mentions is off.\n\nThe exclusion filters below apply to every path."
    type: STRING
  f1ExcludeTargetWithTagName:
    displayName: Exclude entities carrying this tag
    description: "Enter one tag name. Nothing is ever copied onto an entity carrying that tag.\n\nMatched by exact name, case-sensitive. The tag must be carried directly - a parent of it does not count. It is also never copied onto anything itself, since that would permanently exclude whatever received it.\n\nIf you also run ᝯㄝₓ Merge Performer Tags To Scenes and have never set this one, its equivalent is adopted the first time this plugin loads, and saved here as yours. It is asked once: change it here from then on, and a value you set - including switching a toggle back off - is never replaced."
    type: STRING
  f2ExcludeTargetOrganized:
    displayName: Exclude entities marked as Organized
    description: "Skip any entity whose Organized flag is set.\n\nIn Stash 0.31 only scenes, images and galleries have that flag among this plugin's targets; groups have none, so this setting cannot skip them.\n\nIf you also run ᝯㄝₓ Merge Performer Tags To Scenes and have never set this one, its equivalent is adopted the first time this plugin loads, and saved here as yours. It is asked once: change it here from then on, and a value you set - including switching a toggle back off - is never replaced."
    type: BOOLEAN
  f3ExcludeTagWithIgnoreAutoTag:
    displayName: Never copy tags set to Ignore auto tag
    description: "Tags with \"Ignore auto tag\" enabled are never copied onto anything.\n\nIf you also run ᝯㄝₓ Merge Performer Tags To Scenes and have never set this one, its equivalent is adopted the first time this plugin loads, and saved here as yours. It is asked once: change it here from then on, and a value you set - including switching a toggle back off - is never replaced."
    type: BOOLEAN
  f4ExcludeTagWithCustomFieldName:
    displayName: Never copy tags marked via a Custom Field
    description: "Enter a custom field name. A tag carrying this custom field is never copied onto anything.\n\nOnly the presence of the field matters - its value is ignored, so any value at all excludes the tag. Remove the field from a tag to have it copied again.\n\nIf you also run ᝯㄝₓ Merge Performer Tags To Scenes and have never set this one, its equivalent is adopted the first time this plugin loads, and saved here as yours. It is asked once: change it here from then on, and a value you set - including switching a toggle back off - is never replaced."
    type: STRING
  g1LogToConsole:
    displayName: Log every copy to the Browser Console (Info level)
    description: "Logs each tag and performer copied to the browser's JavaScript console.\n\nThat is F12 - Console, not the Stash server log or the Logs page."
    type: BOOLEAN
