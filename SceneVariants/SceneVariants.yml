name: ᝯㄝₓ Scene Variants
description: "A scene is often in your library twice: the whole thing, and a cut out of it. Stash has no way to say the two are the same work, so this plugin works it out and shows you.\n\nOpen any scene and, when other scenes share its stash-id, a Siblings panel appears under the tabs listing them - each one a link, with its resolution and running time, longest first. Nothing else about the page changes, and nothing is written to your library at any point: the panel is two queries and a list of links.\n\nName your full-length and partial-length tags below and each row says which it is, with the full-length ones sorted to the top - that is the question the panel exists to answer, and the tags are the cheap half of it. Leave them empty and the panel still lists the siblings, just without saying which is which.\n\nThe stash-id is the only evidence used. A scene that never got one, or whose siblings never got one, shows no panel; matching on titles and on shared performers is not built yet, so about two scenes in three will show nothing today. A scene carrying both tags at once is shown in red, because the two are meant to be exclusive."
url: "https://github.com/gregttx/StashPlugins/blob/main/SceneVariants/README.md"
version: 0.0.2
ui:
  javascript:
    - SceneVariants.js
settings:
  a1FullLengthTag:
    displayName: Full-length Tag
    description: "The tag you put on a scene that is the whole work.\n\nTyped rather than picked, and compared without regard to case or surrounding spaces. Leave it empty and the panel still lists the siblings - it simply says nothing about which of them is the full one, which is the honest answer when nothing has been tagged.\n\nThis is the discriminator for the one dimension the plugin knows about. It reads the tag and never writes it: a scene missing the tag is listed unclassified rather than corrected."
    type: STRING
  a2PartialLengthTag:
    displayName: Partial-length Tag
    description: "The tag you put on a scene that is a cut out of a longer one.\n\nSame rules as the full-length tag above: typed, case-insensitive, optional. Scenes wearing it sort below the full-length ones in the panel, since the panel's usual question is which sibling is the whole work.\n\nA scene carrying this tag and the full-length one at the same time is shown in red. The two values are mutually exclusive by definition, so the plugin reports the contradiction rather than picking a winner."
    type: STRING
  b1LogToConsole:
    displayName: Log to the Browser Console
    description: "Print each sibling lookup to the browser console.\n\nOff by default. It names the scene, how many siblings were found and what they were matched on, under the [svr] prefix.\n\nThis is not the panel diagnostic: for that, type __GTTx__.StashPluginCoop.debugButtons = true into the console, which turns on an [svr gate] channel in every plugin that draws a control into Stash's chrome and says why each one is shown or hidden. A failed sibling query is always reported, with or without either switch."
    type: BOOLEAN
