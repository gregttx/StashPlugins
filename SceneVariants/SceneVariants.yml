name: ᝯㄝₓ Scene Variants
description: "A scene is often in your library twice: the whole thing, and a cut out of it. Stash has no way to say the two are the same work, so this plugin works it out and gives the scene page a tab that shows you.\n\nOpen any scene and there is a Variants tab beside Details, File Info and Edit. It lists every other scene sharing this one's stash-id, with the cover image and the preview loop it plays on hover, its resolution and running time, longest first - and where there is nothing to list it says why. The tab itself writes nothing: it is two read queries and a list of links. Hover a row and it tells you how that variant differs from the scene you are on: the tags it has that this one does not, the tags it is missing, and the names of the attributes that disagree - which fields differ, not what either of them says.\n\nName your full-length and partial-length tags below and each row says which it is, with the full-length ones sorted to the top - that is the question the tab exists to answer, and the tags are the cheap half of it. A name matches any of the tag's aliases too, and a scene tagged with anything under that tag in your hierarchy counts as tagged with it, so naming the general tag covers every specific one beneath it. Rows read Full-length and Partial-length rather than echoing your tag names back; the tag that decided a row is on its hover text. Leave both names empty and the tab still lists the variants, just without saying which is which.\n\nA stash-id, or the variant stash-id custom field this plugin's migration task writes, is the evidence used - a partial-length cut should not carry a real stash-id, because that id names the whole work, so the task moves it into a field of its own and the tab matches on both. A scene that never got one, or whose variants never got one, gets a tab that says so; matching on titles and on shared performers is not built yet, so about two scenes in three have nothing to list today. A scene carrying both tags at once is shown in red, because the two are meant to be exclusive.\n\nRequires Stash 0.28.0 or newer: the tab is added through the scene page's own plugin extension points, so there is no version of it that works without them."
url: "https://github.com/gregttx/StashPlugins/blob/main/SceneVariants/README.md"
version: 0.7.0
ui:
  javascript:
    - SceneVariants.js
settings:
  a1FullLengthTag:
    displayName: Full-length Tag
    description: "The tag you put on a scene that is the whole work.\n\nTyped rather than picked, and compared without regard to case or surrounding spaces. Any of the tag's aliases finds it as well as its name, and a scene wearing any descendant of it counts as wearing it. Leave it empty and the tab still lists the variants - it simply says nothing about which of them is the full one, which is the honest answer when nothing has been tagged.\n\nThis is the discriminator for the one dimension the plugin knows about. It reads the tag and never writes it: a scene missing the tag is listed unclassified rather than corrected."
    type: STRING
  a2PartialLengthTag:
    displayName: Partial-length Tag
    description: "The tag you put on a scene that is a cut out of a longer one.\n\nSame rules as the full-length tag above: typed, case-insensitive, aliases and descendants included, optional. Scenes wearing it sort below the full-length ones, since the tab's usual question is which variant is the whole work.\n\nA scene carrying this tag and the full-length one at the same time is shown in red. The two values are mutually exclusive by definition, so the plugin reports the contradiction rather than picking a winner. If the two settings name the same tag, or two tags one of which is inside the other, the tab warns above the list instead: every scene under the overlap would otherwise be reported as a contradiction of its own."
    type: STRING
  a3VariantStashIdField:
    displayName: Variant Stash-ID Custom Field
    description: "The custom field the migration task writes a variant's stash-id into.\n\nLeave it empty for ᱜ╦╦🞮_Variant_Stash_ID, which is what the task uses and what the Variants tab reads. The value is one line per stash-id, written as <provider>:<stash-id> - stashdb.org:9f3c1e2a-… - so it stays readable in Stash's own custom fields panel.\n\nChange it only if that name collides with a field you already use. Renaming it here does not move anything already written: the tab will stop finding scenes migrated under the old name, and the task will write the new one beside it."
    type: STRING
  b1LogToConsole:
    displayName: Log to the Browser Console
    description: "Print each variant lookup to the browser console.\n\nOff by default. It names the scene, how many variants were found and what they were matched on, under the [svr] prefix.\n\nThis is not the tab diagnostic: for that, type __GTTx__.StashPluginCoop.debugButtons = true into the console, which turns on an [svr gate] channel in every plugin that draws a control into Stash's chrome and says why each one is shown or hidden. A failed variant query is always reported, with or without either switch."
    type: BOOLEAN

tasks:
  - name: Migrate Variant Stash-IDs...
    description: Move the stash-id of every partial-length scene into a custom field and take the stash-id off it - a stash-id names the whole work, and a cut out of it is not that work. Full-length scenes get the same field and keep their stash-ids, which is what lets the Variants tab find a whole variant set in one query. Every scene it would write is listed before anything is written, and Undo puts them all back while the dialog stays open.
