name: ᝯㄝₓ Scene Variants
description: "A scene is often in your library twice: the whole thing, and a cut out of it. Stash has no way to say the two are the same work, so this plugin works it out and gives the scene page a tab that shows you.\n\nOpen any scene and there is a Variants tab beside Details, File Info and Edit. It lists every other scene sharing this one's stash-id, with the cover image and the preview loop it plays on hover, its resolution and running time, longest first - and where there is nothing to list it says why. Nothing is written to your library at any point: the tab is two read queries and a list of links.\n\nName your full-length and partial-length tags below and each row says which it is, with the full-length ones sorted to the top - that is the question the tab exists to answer, and the tags are the cheap half of it. A name matches any of the tag's aliases too, and a scene tagged with anything under that tag in your hierarchy counts as tagged with it, so naming the general tag covers every specific one beneath it. Rows read Full-length and Partial-length rather than echoing your tag names back; the tag that decided a row is on its hover text. Leave both names empty and the tab still lists the variants, just without saying which is which.\n\nThe stash-id is the only evidence used. A scene that never got one, or whose variants never got one, gets a tab that says so; matching on titles and on shared performers is not built yet, so about two scenes in three have nothing to list today. A scene carrying both tags at once is shown in red, because the two are meant to be exclusive.\n\nRequires Stash 0.28.0 or newer: the tab is added through the scene page's own plugin extension points, so there is no version of it that works without them."
url: "https://github.com/gregttx/StashPlugins/blob/main/SceneVariants/README.md"
version: 0.3.0
ui:
  javascript:
    - SceneVariants.js
settings:
  a1FullLengthTag:
    displayName: Full-length Tag
    description: "The tag you put on a scene that is the whole work.\n\nTyped rather than picked, and compared without regard to case or surrounding spaces. Any of the tag's aliases finds it as well as its name, and a scene wearing any descendant of it counts as wearing it. Leave it empty and the tab still lists the variants - it simply says nothing about which of them is the full one, which is the honest answer when nothing has been tagged.\n\nThis is the discriminator for the one dimension the plugin knows about. It reads the tag and never writes it: a scene missing the tag is listed unclassified rather than corrected."
    type: STRING
  a2PartialLengthTag:
    displayName: Partial-length Tag
    description: "The tag you put on a scene that is a cut out of a longer one.\n\nSame rules as the full-length tag above: typed, case-insensitive, aliases and descendants included, optional. Scenes wearing it sort below the full-length ones, since the tab's usual question is which variant is the whole work.\n\nA scene carrying this tag and the full-length one at the same time is shown in red. The two values are mutually exclusive by definition, so the plugin reports the contradiction rather than picking a winner. If the two settings name the same tag, or two tags one of which is inside the other, the tab warns above the list instead: every scene under the overlap would otherwise be reported as a contradiction of its own."
    type: STRING
  b1LogToConsole:
    displayName: Log to the Browser Console
    description: "Print each variant lookup to the browser console.\n\nOff by default. It names the scene, how many variants were found and what they were matched on, under the [svr] prefix.\n\nThis is not the tab diagnostic: for that, type __GTTx__.StashPluginCoop.debugButtons = true into the console, which turns on an [svr gate] channel in every plugin that draws a control into Stash's chrome and says why each one is shown or hidden. A failed variant query is always reported, with or without either switch."
    type: BOOLEAN
